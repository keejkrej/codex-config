# Essentials merged into ~/.codex/config.toml by install.sh. Codex owns the live
# config; this file only carries what the reviewer agent and the MCP servers need.

[features]
multi_agent = true

[agents]
max_threads = 6
max_depth = 1
job_max_runtime_seconds = 1800

[agents.reviewer]
description = "Independent code reviewer; read-only. Reports findings with file:line and never modifies files."
config_file = "agents/reviewer.toml"
nickname_candidates = ["Athena", "Ada", "Artemis"]

[mcp_servers.paper]
command = "paper"
args = ["mcp"]

[mcp_servers.ambient]
url = "http://127.0.0.1:8765/mcp"

[mcp_servers.mobbin]
command = "npx"
args = ["-y", "mcp-remote", "https://api.mobbin.com/mcp"]

[mcp_servers.browse]
command = "browse"
args = ["mcp"]
